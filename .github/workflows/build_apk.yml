name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Ensure entrypoint exists
        run: |
          if [ -f "vula_app.py" ] && [ ! -f "main.py" ]; then
            cp vula_app.py main.py
          fi

      - name: Build Android APK Non-Interactive
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          flet build apk --project-name "VulaTrade" --org "com.vulatrade.app" --product "VulaTrade Engine" --description "Offline Micro-Enterprise Engine"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulaTrade-Android-APK
          path: |
            build/apk/*.apk
            **/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
